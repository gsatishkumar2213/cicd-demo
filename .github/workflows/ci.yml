name: CI

on:                      # WHEN to run
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:        # a job = a group of steps on one machine
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and run tests
        run: mvn -B verify